name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'APK 를 붙일 릴리스 태그 (release-please 가 전달)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing certificate is the pinned one
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          EXPECTED=$(tr -d '[:space:]' < android/app/signing.sha256)
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartthings-cleaner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to GitHub Release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk smartthings-cleaner.apk
          gh release upload "${{ inputs.tag }}" smartthings-cleaner.apk --clobber
